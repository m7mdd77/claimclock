<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClaimClock</title><link rel="stylesheet" href="style.css"></head>
<body><header><a class="brand" href="/">ClaimClock</a><span>LOCAL WORKSPACE</span><div class="actions"><button id="export">Export</button><label class="file">Import<input id="import" type="file" accept="application/json"></label></div></header>
<main><div class="heading"><div><p class="eyebrow">OPPORTUNITY DESK</p><h1>Keep the deadline.<br>Prove the submission.</h1></div><button class="primary" id="add">+ Add opportunity</button></div>
<section class="stats" aria-label="Workspace totals"><div><span>Real entries</span><strong id="total">0</strong></div><div><span>Ready</span><strong id="ready">0</strong></div><div><span>Needs work</span><strong id="blocked">0</strong></div><div><span>Receipt recorded</span><strong id="submitted">0</strong></div></section>
<div class="toolbar"><input id="search" type="search" placeholder="Search opportunities" aria-label="Search opportunities"><select id="filter" aria-label="Filter status"><option value="all">All statuses</option><option>ready</option><option>blocked</option><option>submitted</option><option>expired</option><option>excluded</option></select><button id="sort">Deadline ↑</button></div>
<p id="notice" role="status"></p><div class="table"><table><thead><tr><th>Opportunity / source</th><th>Deadline</th><th>Readiness</th><th>Next requirement</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" hidden>No opportunities match this view.</p>
</main><dialog id="editor"><form id="form"><div class="modal-head"><h2 id="edit-title">Add opportunity</h2><button type="button" id="close" aria-label="Close">×</button></div><label>Title<input name="title" required maxlength="200"></label><label>Official source<input name="source" type="url" required placeholder="https://"></label><div class="fields"><label>Deadline (your local time)<input name="deadline" type="datetime-local" required></label><label>Reward<select name="reward"><option value="cash">Cash prize</option><option value="noncash">Non-cash</option><option value="unknown">Unverified</option></select></label></div><label>Requirements (one per line)<textarea name="requirements" rows="4" placeholder="Check eligibility&#10;Prepare demo"></textarea></label><div id="checks"></div><label>Submission receipt URL<input name="receipt" type="url" placeholder="https://"></label><label class="check"><input name="synthetic" type="checkbox">Synthetic example</label><p id="form-error" role="alert"></p><footer><button id="delete" type="button">Delete</button><button class="primary" type="submit">Save entry</button></footer></form></dialog><script type="module" src="app.mjs"></script></body></html>
